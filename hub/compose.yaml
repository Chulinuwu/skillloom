services:
  skillloom-hub:
    build:
      context: ..
      dockerfile: hub/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      SKILLLOOM_HUB_BIND_HOST: 0.0.0.0
      SKILLLOOM_HUB_PORT: 8787
      SKILLLOOM_HUB_DATA_DIR: /data
      SKILLLOOM_HUB_TRUSTED_PROXY: tailscale-serve
      SKILLLOOM_OBSIDIAN_AUTHORING_ENABLED: ${SKILLLOOM_OBSIDIAN_AUTHORING_ENABLED:-true}
      SKILLLOOM_OBSIDIAN_AUTHORING_INTERVAL_MS: ${SKILLLOOM_OBSIDIAN_AUTHORING_INTERVAL_MS:-1000}
    volumes:
      - ${SKILLLOOM_HUB_DATA_DIR:-./data}:/data
    networks:
      - hub-runtime
  obsidian:
    image: ${SKILLLOOM_OBSIDIAN_IMAGE:-lscr.io/linuxserver/obsidian:v1.12.7-ls139}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      skillloom-hub:
        condition: service_healthy
    environment:
      PUID: ${SKILLLOOM_OBSIDIAN_PUID:-1000}
      PGID: ${SKILLLOOM_OBSIDIAN_PGID:-1000}
      TZ: ${TZ:-Asia/Bangkok}
      HARDEN_DESKTOP: "true"
      START_DOCKER: "false"
      SELKIES_ENABLE_SHARING: "false"
    shm_size: 1gb
    volumes:
      - ${SKILLLOOM_OBSIDIAN_CONFIG_DIR:-./obsidian-config}:/config
      - ${SKILLLOOM_OBSIDIAN_CONFIG_DIR:-./obsidian-config}/vault-shell:/config/Documents/Skillloom:rw
      - ${SKILLLOOM_HUB_DATA_DIR:-./data}/brain/projections/obsidian-vault/Library:/config/Documents/Skillloom/Library:rw
      - ${SKILLLOOM_OBSIDIAN_CONFIG_DIR:-./obsidian-config}/vault-config:/config/Documents/Skillloom/.obsidian:rw
      - ${SKILLLOOM_HUB_DATA_DIR:-./data}/brain/obsidian-ui/Bases:/config/Documents/Skillloom/Bases:rw
      - ${SKILLLOOM_HUB_DATA_DIR:-./data}/brain/authoring:/config/Documents/Skillloom/Authoring:rw
    networks:
      - obsidian-runtime

networks:
  hub-runtime:
  obsidian-runtime:
